name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag $GITHUB_REF_NAME, Cargo.toml $version"
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Build scripts link the image's glibc; rust-cache only keys on runner.os.
          env-vars: ImageOS
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev libsdl2-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings -A dead_code
      # The handheld pieces are only ever built for the device; make sure
      # they still compile.
      - name: SDL host
        run: cargo build --locked --no-default-features --features sdl-host
      - name: SDL shim
        run: gcc -shared -fPIC -O2 -Wall -Wextra -Werror -o /dev/null handheld/sdl-dynapi.c -ldl

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for an older glibc baseline
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: zitch
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: zitch
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: zitch
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: zitch.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Build scripts link the image's glibc; rust-cache only keys on runner.os.
          env-vars: ImageOS
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=${GITHUB_SHA::7}; fi
          dir=zitch-$version-${{ matrix.name }}
          mkdir -p dist/$dir
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} README.md dist/$dir/
          cp assets/prompts/LICENSE-kenney.txt dist/$dir/
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then 7z a -bd $dir.zip $dir; else tar czf $dir.tar.gz $dir; fi
          rm -rf $dir
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: zitch-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  muos:
    name: muOS package
    # muOS is on glibc 2.38 so we need older linux to build it
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: muos
          # Build scripts link the image's glibc; rust-cache only keys on runner.os.
          env-vars: ImageOS
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zip
      # bundles butler
      - run: make handheld-muxapp
      # check the binary will still load on muOS's glibc 2.38
      - name: glibc check
        run: |
          need=$(objdump -T target/aarch64-unknown-linux-gnu/release/zitch | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $need"
          test "$(printf '%s\nGLIBC_2.38\n' "$need" | sort -V | tail -1)" = GLIBC_2.38
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=${GITHUB_SHA::7}; fi
          mkdir -p dist
          cp target/zitch.muxapp dist/zitch-$version-muos.muxapp
      - uses: actions/upload-artifact@v4
        with:
          name: zitch-muos
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, muos]
    runs-on: ubuntu-latest
    # waits for approval; create the release by hand before approving
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Upload
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
