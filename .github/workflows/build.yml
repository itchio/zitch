name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev libsdl2-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings -A dead_code
      # The handheld pieces are only ever built for the device; make sure
      # they still compile.
      - name: SDL host
        run: cargo build --locked --no-default-features --features sdl-host
      - name: SDL shim
        run: gcc -shared -fPIC -O2 -Wall -Wextra -Werror -o /dev/null handheld/sdl-dynapi.c -ldl

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: zitch
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: zitch
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: zitch
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: zitch.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Size
        shell: bash
        run: ls -l target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: zitch-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  muos:
    name: muOS package
    # muOS is on glibc 2.38 so we need older linux to build it
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: muos
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zip
      - run: make handheld-muxapp
      # check the binary will still load on muOS's glibc 2.38
      - name: glibc check
        run: |
          need=$(objdump -T target/aarch64-unknown-linux-gnu/release/zitch | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $need"
          test "$(printf '%s\nGLIBC_2.38\n' "$need" | sort -V | tail -1)" = GLIBC_2.38
      - uses: actions/upload-artifact@v4
        with:
          name: zitch-muos
          path: target/zitch.muxapp
          if-no-files-found: error
